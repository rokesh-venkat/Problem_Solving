name: Update Coding Stats

on:
  schedule:
    # Run daily at 12:00 UTC (5:30 PM IST)
    - cron: '0 12 * * *'
  
  # Also allow manual trigger
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Fetch and Update Stats
        run: |
          python scripts/update_stats.py

      - name: Commit Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Update coding stats" && git push)

      - name: Verify Update
        run: |
          echo "✅ Stats updated successfully!"
          echo "Next update: Tomorrow at 12:00 UTC"